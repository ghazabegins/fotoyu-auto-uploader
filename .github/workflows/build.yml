name: Build & Release Desktop App (EXE & DMG)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish release assets to GitHub Releases?'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: Windows (EXE Installer)
            artifact_name: fotoyu-uploader-windows
            build_script: npm run build:win
          - os: macos-latest
            target_name: macOS (DMG Package)
            artifact_name: fotoyu-uploader-macos
            build_script: npm run build:mac

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Compile Native Camera Bridge (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "Compiling Native Camera Bridge for macOS..."
          SDK_PATH=$(xcrun --show-sdk-path)
          echo "Using macOS SDK at: $SDK_PATH"
          clang -O2 -fobjc-arc -isysroot "$SDK_PATH" -Wno-everything -framework Foundation -framework ImageCaptureCore src/main/scripts/mac_camera_bridge.m -o src/main/scripts/mac_camera_bridge || true
          
          if [ -f "src/main/scripts/mac_camera_bridge" ]; then
            chmod +x src/main/scripts/mac_camera_bridge
            file src/main/scripts/mac_camera_bridge
            ls -la src/main/scripts/mac_camera_bridge
            echo "Native camera bridge compiled successfully!"
          else
            echo "Warning: Native binary compilation skipped, using Swift script fallback."
          fi

      - name: Compile & Package Application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.build_script }}

      - name: Inject panduan.txt & launcher into macOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          for dmg in dist/*.dmg; do
            echo "Injecting panduan.txt into $dmg..."
            hdiutil convert "$dmg" -format UDRW -o "dist/temp_rw.dmg"
            MOUNT_OUTPUT=$(hdiutil attach "dist/temp_rw.dmg" -nobrowse)
            MOUNT_DIR=$(echo "$MOUNT_OUTPUT" | grep -o '/Volumes/.*' | head -n 1)
            echo "Mounted volume at: $MOUNT_DIR"
            
            cp "build/panduan.txt" "$MOUNT_DIR/PANDUAN_BUKA_APLIKASI.txt"
            cp "build/Buka_Aplikasi_Mac.command" "$MOUNT_DIR/Buka_Aplikasi_Mac.command"
            chmod +x "$MOUNT_DIR/Buka_Aplikasi_Mac.command"
            
            hdiutil detach "$MOUNT_DIR" -force
            rm -f "$dmg"
            hdiutil convert "dist/temp_rw.dmg" -format ULFO -o "$dmg"
            rm -f "dist/temp_rw.dmg"
            echo "Successfully updated $dmg with panduan and launcher!"
          done

      - name: Upload Build Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          retention-days: 30
          path: |
            dist/*.exe
            dist/*.dmg

  release:
    name: Publish to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: fotoyu-uploader-windows
          path: release_assets/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: fotoyu-uploader-macos
          path: release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/*.exe
            release_assets/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
